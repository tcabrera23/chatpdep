version: '3.8'

# =============================================================================
# Docker Compose para CPU (sin GPU)
# =============================================================================
# Este archivo es para usuarios que NO tienen GPU NVIDIA
# Uso: docker-compose -f docker-compose.cpu.yml up --build
#
# Diferencias con docker-compose.yml:
# - No requiere configuración de GPU
# - Funciona en cualquier sistema (Windows, Mac, Linux)
# - Ollama usa solo CPU (más lento pero funcional)

services:
  # Servicio principal de la aplicación
  chatpdep:
    build: .
    container_name: chatpdep_app
    ports:
      - "8501:8501"
    volumes:
      # Montar volumen para persistir base de datos SQLite
      - ./data:/app/data
      # Montar código para desarrollo (opcional, comentar en producción)
      - .:/app
    environment:
      # Variables de entorno (se pueden sobreescribir con .env)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_ANON_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434
    env_file:
      - .env
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - chatpdep_network

  # Servicio de Ollama para LLMs locales (CPU only)
  ollama:
    image: ollama/ollama:latest
    container_name: chatpdep_ollama
    ports:
      - "11434:11434"
    volumes:
      # Persistir modelos descargados
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      # Variables para optimizar CPU
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    restart: unless-stopped
    networks:
      - chatpdep_network
    # Instalar phi4-mini (economy) y qwen3 4b (código) por defecto
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /bin/ollama serve &
        sleep 5
        echo "=== Instalando phi4-mini (preguntas simples) ==="
        ollama pull phi4-mini
        echo "=== Instalando qwen3 4B (código y consultas complejas) ==="
        ollama pull qwen3:4b
        echo "=== Modelos instalados correctamente ==="
        ollama list
        echo "=== Sugerencia: también podés instalar ==="
        echo "    ollama pull deepseek-coder:6.7b"
        echo "    ollama pull qwen2.5-coder:7b"
        wait

networks:
  chatpdep_network:
    driver: bridge

volumes:
  chatpdep_data:
    driver: local
  ollama_models:
    driver: local
